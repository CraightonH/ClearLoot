name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lua:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        version: ["5.1", "5.4"]
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua${{ matrix.version }}
      - name: Run model, history, and addon integration checks
        run: make test LUA=lua${{ matrix.version }}
      - name: Build addon ZIP
        run: python3 scripts/package.py
